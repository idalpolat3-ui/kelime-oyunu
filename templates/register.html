<!DOCTYPE html>
<html>
<head>
    <title>Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .btn { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h1>🎉</h1>
                        <h2 class="fw-bold">Kayıt Ol</h2>
                        <p class="text-muted">Hemen ücretsiz hesap oluştur</p>
                    </div>
                    {% for msg in get_flashed_messages() %}
                        <div class="alert alert-success">{{ msg }}</div>
                    {% endfor %}
                    <form method="POST">
                        <div class="mb-3">
                            <input type="text" name="username" class="form-control form-control-lg" placeholder="👤 Kullanıcı Adı" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control form-control-lg" placeholder="🔑 Şifre" required>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Kayıt Ol</button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a href="/login" class="text-decoration-none">Zaten hesabın var mı? <strong>Giriş yap</strong></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
