<!DOCTYPE html>
<html>
<head>
    <title>Kelime Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="fw-bold mb-4">✏️ Kelime Düzenle</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">İngilizce</label>
                            <input type="text" name="english" class="form-control" value="{{ word.english }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Türkçe</label>
                            <input type="text" name="turkish" class="form-control" value="{{ word.turkish }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Resim URL</label>
                            <input type="text" name="picture" class="form-control" value="{{ word.picture or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Örnek Cümle</label>
                            <input type="text" name="sample" class="form-control" value="{{ sample.sample if sample else '' }}">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">💾 Kaydet</button>
                    </form>
                    <hr>
                    <a href="/" class="btn btn-outline-secondary w-100">Geri Dön</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
