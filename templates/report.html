<!DOCTYPE html>
<html>
<head>
    <title>Analiz Raporu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .stat-card { border-radius: 15px; padding: 20px; text-align: center; }
        .rate-display { font-size: 48px; font-weight: bold; color: #764ba2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4">
                    <h2 class="fw-bold text-center mb-4">📊 Analiz Raporu</h2>
                    <h5 class="text-center text-muted mb-4">{{ current_user.username }} - Kelime İstatistikleri</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-4">
                            <div class="stat-card bg-primary text-white">
                                <h3>{{ total }}</h3>
                                <small>Toplam</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-card bg-success text-white">
                                <h3>{{ learned }}</h3>
                                <small>Öğrenilen</small>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-card bg-danger text-white">
                                <h3>{{ not_learned }}</h3>
                                <small>Öğrenilmemiş</small>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mb-4">
                        <div class="rate-display">{{ success_rate }}%</div>
                        <p class="text-muted">Başarı Oranı</p>
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-success" style="width: {{ success_rate }}%"></div>
                        </div>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success fw-bold" onclick="window.print()">🖨️ Yazdır</button>
                        <a href="/" class="btn btn-primary fw-bold">Ana Sayfaya Dön</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
