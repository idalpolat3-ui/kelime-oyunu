<!DOCTYPE html>
<html>
<head>
    <title>Sınav</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .word-display { font-size: 56px; font-weight: bold; color: #764ba2; }
        .btn { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 text-center">
                    {% if word %}
                        <h3 class="fw-bold mb-3">🧠 Bu kelimeyi biliyor musun?</h3>
                        <div class="word-display mb-2">{{ word.english }}</div>
                        <p class="text-muted mb-1">Türkçesi: <strong>{{ word.turkish }}</strong></p>
                        <div class="mb-4">
                            <span class="badge bg-primary fs-6">{{ word.correct_count }}/6 doğru</span>
                        </div>
                        <div class="d-flex gap-3 justify-content-center">
                            <a href="/answer/{{ word.id }}/1" class="btn btn-success btn-lg fw-bold px-5">✅ Biliyorum</a>
                            <a href="/answer/{{ word.id }}/0" class="btn btn-danger btn-lg fw-bold px-5">❌ Bilmiyorum</a>
                        </div>
                    {% else %}
                        <h2 class="fw-bold">🎉 Bugünlük bitti!</h2>
                        <p class="text-muted">Tekrar edilecek kelime kalmadı. Yarın devam et!</p>
                    {% endif %}
                    <hr>
                    <a href="/" class="btn btn-outline-primary">Ana Sayfaya Dön</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
