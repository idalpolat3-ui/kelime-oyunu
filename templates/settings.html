<!DOCTYPE html>
<html>
<head>
    <title>Ayarlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .btn { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h1>⚙️</h1>
                        <h2 class="fw-bold">Ayarlar</h2>
                    </div>
                    {% for msg in get_flashed_messages() %}
                        <div class="alert alert-success">{{ msg }}</div>
                    {% endfor %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Günlük yeni kelime sayısı:</label>
                            <input type="number" name="daily_count" class="form-control form-control-lg" value="{{ current_count }}" min="1" max="50">
                        </div>
                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">💾 Kaydet</button>
                    </form>
                    <hr>
                    <a href="/" class="btn btn-outline-primary w-100">Ana Sayfaya Dön</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
