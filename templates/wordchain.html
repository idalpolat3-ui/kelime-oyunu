<!DOCTYPE html>
<html>
<head>
    <title>Word Chain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .btn { border-radius: 10px; }
        .story-box { background: #f3e5f5; border-radius: 15px; padding: 20px; border-left: 5px solid #9C27B0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h1>🔗</h1>
                        <h2 class="fw-bold">Word Chain - LLM Hikaye</h2>
                        <p class="text-muted">Kelimelerini virgülle ayırarak yaz, yapay zeka bir hikaye oluştursun!</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <textarea name="words" class="form-control" rows="3" placeholder="Örnek: brain, night, tiger, robin, noble">{% if words_used %}{{ words_used }}{% endif %}</textarea>
                        </div>
                        <button type="submit" class="btn btn-lg w-100 fw-bold" style="background:#9C27B0;color:white;">🤖 Hikaye Oluştur</button>
                    </form>
                    {% if story %}
                    <div class="story-box mt-4">
                        <h5 class="fw-bold">📖 Oluşturulan Hikaye:</h5>
                        <p>{{ story }}</p>
                    </div>
                    {% endif %}
                    <hr>
                    <a href="/" class="btn btn-outline-primary w-100 mt-2">Ana Sayfaya Dön</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
